version: 2
updates:
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: daily
    time: "23:30"
  open-pull-requests-limit: 10
  groups:
    composer-minor-patch:
      update-types:
      - "minor"
      - "patch"
  ignore:
  - dependency-name: hybridauth/hybridauth
    versions:
    - 3.7.0
